[package]
name = "mineclient"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.5"
glfw = { version = "0.60.0", features = ["static-link"] }
glutin = "0.32.3"
image = { version = "0.25.8", default-features = false, features = ["png"] }
lazy_static = "1.5.0"
rand = "0.9.2"

[build-dependencies]
gl_generator = "0.14.0"

[target.'cfg(not(windows))'.dependencies]
glfw = { version = "0.60.0", features = ["static-link", "src-build"] }
